services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: /bin/sh
    command: -c "until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 2; done; mc mb --ignore-existing local/${MINIO_BUCKET_BRONZE}; mc mb --ignore-existing local/${MINIO_BUCKET_SILVER}; mc mb --ignore-existing local/${MINIO_BUCKET_GOLD}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_BRONZE: ${MINIO_BUCKET_BRONZE}
      MINIO_BUCKET_SILVER: ${MINIO_BUCKET_SILVER}
      MINIO_BUCKET_GOLD: ${MINIO_BUCKET_GOLD}
      DATABRICKS_HOST: ${DATABRICKS_HOST:-}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
      DATABRICKS_VOLUME_PATH: ${DATABRICKS_VOLUME_PATH:-}
      DATABRICKS_GOLD_PREFIX: ${DATABRICKS_GOLD_PREFIX:-}
      DATABRICKS_REQUEST_TIMEOUT_SECONDS: ${DATABRICKS_REQUEST_TIMEOUT_SECONDS:-60}

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW__WEBSERVER__WEB_SERVER_STARTUP_TIMEOUT: 300
      AIRFLOW__WEBSERVER__WORKERS: 1
      PYTHONPATH: /opt/airflow/src
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL}
      COINGECKO_CRYPTO_IDS: ${COINGECKO_CRYPTO_IDS:-bitcoin,ethereum}
      COINGECKO_VS_CURRENCY: ${COINGECKO_VS_CURRENCY:-usd}
      COINGECKO_REQUEST_TIMEOUT_SECONDS: ${COINGECKO_REQUEST_TIMEOUT_SECONDS:-30}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_REGION: ${MINIO_REGION}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_BRONZE: ${MINIO_BUCKET_BRONZE}
      MINIO_BUCKET_SILVER: ${MINIO_BUCKET_SILVER}
      MINIO_BUCKET_GOLD: ${MINIO_BUCKET_GOLD}
    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./src:/opt/airflow/src
      - ./dbt:/opt/airflow/dbt
    command: bash -c "airflow db migrate && airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Data --lastname Engineer --role Admin --email admin@example.com || true"

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    command: airflow webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    command: airflow scheduler

volumes:
  postgres_data:
  minio_data:
