version: 2

models:
  - name: silver_market_prices
    description: "Precos de mercado achatados e tipados da camada Silver."
    columns:
      - name: market_record_id
        description: "Chave deterministica do ativo, data e moeda de cotacao."
        tests:
          - not_null
          - unique
      - name: crypto_id
        description: "Identificador do ativo na CoinGecko."
        tests:
          - not_null
      - name: reference_date
        description: "Data de referencia do snapshot."
        tests:
          - not_null
      - name: price_usd
        description: "Preco do ativo na moeda de cotacao."
        tests:
          - not_null
